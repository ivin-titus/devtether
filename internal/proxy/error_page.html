<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline';">
    <title>{{.StatusCode}} {{.StatusText}} | DevTether</title>
    <style>
        :root {
            --bg-color: #0c0a09;
            --glass-bg: rgba(28, 25, 23, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f5f5f4;
            --text-secondary: #a8a29e;
            --accent: #f43f5e;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(244, 63, 94, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.08), transparent 25%);
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .status-badge {
            background-color: rgba(244, 63, 94, 0.15);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.2;
        }

        p {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .details-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .details-row {
            display: flex;
            margin-bottom: 12px;
            font-size: 0.875rem;
        }
        
        .details-row:last-child {
            margin-bottom: 0;
        }

        .label {
            color: var(--text-secondary);
            width: 100px;
            font-weight: 500;
        }

        .value {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: var(--text-primary);
            word-break: break-all;
            overflow-wrap: break-word;
        }

        .hint {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: rgba(56, 189, 248, 0.1);
            border-left: 3px solid #38bdf8;
            padding: 16px;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: #bae6fd;
        }

        .hint svg {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            color: #38bdf8;
        }

        .trace {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--glass-border);
        }

        .trace h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        pre {
            background: #000;
            border: 1px solid var(--glass-border);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.8rem;
            color: #f87171;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="status-badge">{{.StatusCode}}</span>
            <h1>{{.StatusText}}</h1>
        </div>
        
        <p>{{.Message}}</p>
        
        {{if .Details}}
        <div class="details-box">
            {{range .Details}}
            <div class="details-row">
                <span class="label">{{.Label}}</span>
                <span class="value">{{.Value}}</span>
            </div>
            {{end}}
        </div>
        {{end}}

        {{if .Hint}}
        <div class="hint">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <div>
                <strong>{{.Hint.Title}}</strong><br>
                {{.Hint.Message}}
            </div>
        </div>
        {{end}}

        {{if .ErrorTrace}}
        <div class="trace">
            <h3>Diagnostic Trace</h3>
            <pre>{{.ErrorTrace}}</pre>
        </div>
        {{end}}
    </div>
</body>
</html>
